[project]
name = "mibo-client"
version = "0.1.0"
description = "Client SDK for MB Cloud quantum experiments"
authors = [
    {name = "MB software team", email = "opensource@mbslabs.tech"},
    {name = "wanghongcheng", email = "wanghongcheng@mbslabs.tech"},
    {name = "huangxiaozhong", email = "huangxiaozhong@mbslabs.tech"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.23,<3.0",
    "scipy>=1.10,<2.0",
    "pandas>=1.5,<3.0",
    "matplotlib>=3.7,<4.0",
    "python-dotenv>=1.0,<2.0",
    "dynaconf>=3.2.11,<4.0",
    "requests>=2.32,<3.0",
    "rich>=13.9,<15.0",
    "ipykernel>=6.29,<8.0",
]

[tool.poetry]
packages = [{include = "mb_client", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
matplotlib = ">=3.7,<4.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = {version = "0.0.73", python = ">=3.11"}
mkdocstrings-python = {version = "2.0.10", python = ">=3.11"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
